spring.application.name=backend

# Defaults to H2 in-memory DB for local dev, but can be overridden by env vars for MySQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:devpilot;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate / JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Config (disabled for H2 in-memory local dev to allow ddl-auto auto-creation of code_chunks table)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# Groq (Free LLM Provider)
app.groq.api-key=${GROQ_API_KEY}
app.groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# Hugging Face (Free Embeddings Provider)
app.hf.api-key=${HF_API_KEY}
app.hf.model=${HF_MODEL:sentence-transformers/all-MiniLM-L6-v2}

# RAG Indexing Settings
app.indexing.chunk-size=800
app.indexing.chunk-overlap=150
app.indexing.max-file-bytes=102400
app.indexing.max-files=60

# Github OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Session Cookie
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App Config
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.crypto.password=${APP_CRYPTO_PASSWORD:devpilot-secure-crypto-key-change-in-prod}
app.crypto.salt=${APP_CRYPTO_SALT:12345678}