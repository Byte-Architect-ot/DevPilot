services:
  mysql:
    image: mysql:8.0
    container_name: devpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devpilot
      MYSQL_USER: devpilot
      MYSQL_PASSWORD: devpilot
    ports:
      - "3307:3306"
    volumes:
      - devpilot_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devpilot_mysql_data: